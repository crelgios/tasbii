<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>My Dua Counter</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"><style>
:root{--bg1:#ecfff8;--bg2:#eef4ff;--card:rgba(255,255,255,.82);--text:#14213d;--muted:#667085;--primary:#078b72;--primary2:#16c79a;--gold:#d9a441;--danger:#e63946;--line:rgba(7,139,114,.18);--shadow:0 22px 70px rgba(8,61,70,.18);--glass:rgba(255,255,255,.55);--btnText:#fff}html[data-theme='dark']{--bg1:#061b21;--bg2:#07101f;--card:rgba(13,31,39,.82);--text:#f4fffb;--muted:#a9bec4;--primary:#16c79a;--primary2:#6fffe9;--gold:#ffd166;--danger:#ff5c77;--line:rgba(111,255,233,.20);--shadow:0 22px 80px rgba(0,0,0,.42);--glass:rgba(255,255,255,.08);--btnText:#05201b}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Poppins',system-ui,sans-serif;color:var(--text);overflow-x:hidden;background:radial-gradient(circle at 20% 10%,rgba(22,199,154,.32),transparent 30%),radial-gradient(circle at 85% 18%,rgba(217,164,65,.25),transparent 28%),linear-gradient(135deg,var(--bg1),var(--bg2));padding:18px;animation:pageFadeIn .42s ease both}body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.34;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;animation:gridMove 18s linear infinite}body::after{content:"۞";position:fixed;right:-40px;top:-80px;font-family:'Amiri',serif;font-size:300px;color:var(--primary);opacity:.045;pointer-events:none;animation:float 7s ease-in-out infinite}@keyframes gridMove{to{background-position:44px 44px}}@keyframes float{50%{transform:translate(-10px,18px) rotate(6deg)}}@keyframes pageFadeIn{from{opacity:0;transform:translateY(16px) scale(.985);filter:blur(8px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}@keyframes pageFadeOut{from{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}to{opacity:0;transform:translateY(-14px) scale(.985);filter:blur(8px)}}body.is-leaving{animation:pageFadeOut .28s ease both;pointer-events:none}.app{width:min(920px,100%);margin:auto;position:relative;z-index:1}.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:6px 0 18px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--gold));display:grid;place-items:center;color:white;box-shadow:0 0 30px rgba(22,199,154,.4);font-size:20px}.brand h1{font-size:clamp(1.45rem,5vw,2.25rem);line-height:1.05;color:var(--primary)}.brand p{font-size:.86rem;color:var(--muted);margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:var(--glass);color:var(--text);padding:10px 13px;border-radius:999px;cursor:pointer;backdrop-filter:blur(12px);box-shadow:0 8px 20px rgba(0,0,0,.06);transition:.2s;text-decoration:none;font:inherit}.pill:hover{transform:translateY(-1px);border-color:var(--primary)}.pill.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:var(--btnText);border-color:transparent}.pill.danger{color:var(--danger)}.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;align-items:stretch}.card{background:var(--card);border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);backdrop-filter:blur(18px);overflow:hidden}.counter-card{padding:24px;text-align:center;position:relative}.name-display{min-height:180px;display:flex;flex-direction:column;justify-content:center;transition:.3s}.arabic-text{font-family:'Amiri',serif;font-size:clamp(2rem,10vw,4.2rem);line-height:1.35;color:var(--primary);text-shadow:0 0 22px rgba(22,199,154,.24);direction:rtl}.transliteration{font-size:clamp(1.15rem,4vw,1.6rem);font-weight:800;margin-top:4px;color:var(--text)}.meaning{color:var(--muted);font-size:.95rem;margin-top:4px}.counter-ring{width:min(245px,72vw);aspect-ratio:1;margin:10px auto 18px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--primary2) var(--angle,0deg),rgba(120,130,140,.18) 0deg)}.counter-ring::before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 34px rgba(22,199,154,.12)}.counter-number{position:relative;font-size:clamp(3.2rem,16vw,5.2rem);font-weight:800;color:var(--primary)}.progress-text{position:relative;margin-top:-8px;color:var(--muted);font-size:.85rem}.count-button{width:min(168px,48vw);height:min(168px,48vw);border-radius:50%;border:0;color:var(--btnText);background:radial-gradient(circle at 35% 25%,var(--primary2),var(--primary));box-shadow:0 18px 40px rgba(22,199,154,.32),inset 0 -10px 18px rgba(0,0,0,.16);font-size:2.2rem;cursor:pointer;position:relative;overflow:hidden;transition:.12s}.count-button:active{transform:scale(.94)}.count-button::after{content:"TAP";position:absolute;bottom:30px;left:0;right:0;font-size:.75rem;font-weight:700;letter-spacing:2px;opacity:.7}.stats{padding:22px;display:grid;gap:14px}.stat{background:var(--glass);border:1px solid var(--line);padding:16px;border-radius:22px;display:flex;justify-content:space-between;align-items:center}.stat strong{font-size:1.25rem;color:var(--primary)}.stat span{color:var(--muted);font-size:.9rem}.quote{padding:18px;border-radius:24px;background:linear-gradient(135deg,rgba(217,164,65,.18),rgba(22,199,154,.12));border:1px solid var(--line);font-size:.95rem;color:var(--muted)}.names-section{margin-top:18px;padding:20px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}.section-title h2{font-size:1.2rem;color:var(--primary)}.search{flex:1;min-width:190px;border:1px solid var(--line);border-radius:999px;padding:12px 14px;background:var(--glass);color:var(--text);outline:none}.names-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;max-height:390px;overflow:auto;padding:2px 4px 2px 2px}.name-item{border:1px solid var(--line);background:var(--glass);border-radius:18px;padding:12px;text-align:left;cursor:pointer;transition:.2s;color:var(--text)}.name-item:hover,.name-item.active{transform:translateY(-2px);border-color:var(--primary);box-shadow:0 10px 24px rgba(22,199,154,.16)}.name-item.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:white}.name-item-number{font-size:.75rem;opacity:.72}.name-item-text{font-weight:800;font-size:.92rem;margin-top:2px}.name-item-ar{font-family:'Amiri',serif;font-size:1.45rem;margin-top:4px;direction:rtl}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:999px;padding:12px 18px;color:var(--text);z-index:99;transition:.3s;white-space:nowrap}.toast.show{transform:translateX(-50%) translateY(0)}.spark{position:fixed;border-radius:50%;pointer-events:none;z-index:9;background:var(--gold);animation:spark .85s ease-out forwards}@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}@keyframes rip{to{transform:translate(-50%,-50%) scale(9);opacity:0}}@media(max-width:760px){body{padding:10px}.hero{grid-template-columns:1fr}.topbar{justify-content:center;text-align:center}.brand{justify-content:center;width:100%}.actions{width:100%;justify-content:center}.names-grid{grid-template-columns:repeat(2,minmax(0,1fr));max-height:360px}.pill{font-size:.82rem;padding:9px 11px}}
.quick-select-section{margin:10px 0 18px;padding:18px;background:linear-gradient(135deg,rgba(255,255,255,.72),rgba(255,255,255,.38));border:1px solid var(--line);border-radius:28px;box-shadow:0 18px 55px rgba(8,61,70,.14);backdrop-filter:blur(18px)}html[data-theme='dark'] .quick-select-section{background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.045))}.premium-select-label{display:flex;align-items:center;gap:10px;margin-bottom:10px;color:var(--primary);font-weight:800;font-size:.95rem}.premium-select-label i{width:34px;height:34px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(22,199,154,.20),rgba(217,164,65,.16));border:1px solid var(--line)}.select-wrap{position:relative}.premium-select{width:100%;appearance:none;-webkit-appearance:none;border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--text);padding:15px 50px 15px 16px;font:inherit;font-weight:800;box-shadow:0 12px 30px rgba(0,0,0,.07);outline:none;cursor:pointer}.premium-select:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(22,199,154,.13),0 12px 30px rgba(0,0,0,.07)}.select-wrap .select-arrow{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--primary);pointer-events:none}.names-section{display:none!important}@media(max-width:760px){.quick-select-section{position:sticky;top:8px;z-index:20;margin:6px 0 12px;padding:14px;border-radius:24px}.premium-select{padding:14px 46px 14px 14px;font-size:.94rem}.premium-select-label{font-size:.88rem;margin-bottom:8px}}</style></head><body><div class="app"><header class="topbar"><div class="brand"><div class="logo"><i class="fas fa-hand-holding-heart"></i></div><div><h1>My Dua Counter</h1><p>Choose any dua and recite your custom limit</p></div></div><div class="actions"><a href="index.html" class="pill"><i class="fas fa-kaaba"></i> 99 Names</a><a href="daily-dhikr.html" class="pill"><i class="fas fa-book-open"></i> Daily Dhikr</a><a href="dua-counter.html" class="pill active"><i class="fas fa-hand-holding-heart"></i> My Dua</a><button id="reset-btn" class="pill"><i class="fas fa-redo"></i> Reset Current</button><button id="theme-toggle" class="pill"><i class="fas fa-moon"></i> Dark Mode</button></div></header><section class="quick-select-section" aria-label="Choose Dua Tasbih"><div class="premium-select-label"><i class="fas fa-hand-holding-heart"></i><span>Choose Dua Tasbih</span></div><div class="select-wrap"><select id="search" class="premium-select" aria-label="Choose Dua Tasbih"></select><i class="fas fa-chevron-down select-arrow"></i></div><div id="duas-container" class="names-grid" style="display:none"></div></section><main class="hero"><section class="card counter-card"><div class="name-display"><h2 id="dua-arabic" class="arabic-text">Loading...</h2><p id="dua-title" class="transliteration"></p><p id="dua-meaning" class="meaning"></p></div><div class="counter-ring" id="counter-ring"><h3 id="counter" class="counter-number">0</h3></div><p class="progress-text" id="progress-text">0 / 100 recitations</p><button id="count-btn" class="count-button" aria-label="Add count"><i class="fas fa-plus"></i></button></section><aside class="card stats"><div class="stat"><span>Current Dua</span><strong id="current-stat">1/1</strong></div><div class="stat"><span>This Dua Count</span><strong id="dua-stat">0</strong></div><div class="stat"><span>Total Recitations</span><strong id="total-stat">0</strong></div><div class="quote">Add or edit these duas from your admin panel.</div></aside></main></div><div id="toast" class="toast"></div><script>
const FALLBACK_DUAS=[{id:'durood_shareef',title:'Durood Shareef',arabic:'اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ',meaning:'Send blessings upon Prophet Muhammad ﷺ',limit:100,note:'Recite 100 times'},{id:'astaghfirullah',title:'Astaghfirullah',arabic:'أَسْتَغْفِرُ اللهَ',meaning:'I seek forgiveness from Allah',limit:100,note:'Recite 100 times'}];
const $=id=>document.getElementById(id);let duas=[],currentIndex=0,counts={},isDark=false,lastTap=0;const arabic=$('dua-arabic'),title=$('dua-title'),meaning=$('dua-meaning'),counterEl=$('counter'),ring=$('counter-ring'),progress=$('progress-text'),currentStat=$('current-stat'),duaStat=$('dua-stat'),totalStat=$('total-stat'),box=$('duas-container'),search=$('search'),toast=$('toast'),btn=$('count-btn'),themeBtn=$('theme-toggle');
function loadState(){try{const s=JSON.parse(localStorage.getItem('myDuaCounterState')||'{}');currentIndex=Number(s.currentIndex)||0;counts=s.counts||{};isDark=!!s.isDark}catch(e){}}function saveState(){localStorage.setItem('myDuaCounterState',JSON.stringify({currentIndex,counts,isDark}))}async function loadDuas(){try{const r=await fetch('/api/counter-duas?t='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache','Pragma':'no-cache'}});if(r.ok){const d=await r.json();const list=Array.isArray(d)?d:(Array.isArray(d.duas)?d.duas:[]);if(list.length)return list}}catch(e){}return FALLBACK_DUAS}function cur(){return duas[currentIndex]||duas[0]||FALLBACK_DUAS[0]}function id(){return cur().id||('dua_'+currentIndex)}function count(){return Number(counts[id()]||0)}function limit(){return Math.max(1,Number(cur().limit)||100)}function total(){return Object.values(counts).reduce((a,b)=>a+(Number(b)||0),0)}function render(){const d=cur();arabic.textContent=d.arabic||'';title.textContent=d.title||'Untitled Dua';meaning.textContent=d.meaning||d.note||'';const c=count();counterEl.textContent=c;const lim=limit();ring.style.setProperty('--angle',(Math.min(lim,c)/lim)*360+'deg');progress.textContent=c+' / '+lim+' recitations';currentStat.textContent=(currentIndex+1)+'/'+duas.length;duaStat.textContent=c;totalStat.textContent=total();renderList()}function renderList(){search.innerHTML=duas.map((d,i)=>'<option value="'+i+'">'+(i+1)+'. '+esc(d.title||'Dua')+' • '+(Number(d.limit)||100)+' times</option>').join('');search.value=String(currentIndex)}function tap(e){if(e)e.preventDefault();const now=Date.now();if(now-lastTap<180)return;lastTap=now;ripple(e);const k=id();const lim=limit();counts[k]=Math.min(lim,(Number(counts[k]||0)+1));if(counts[k]>=lim){celebrate();showToast('MashaAllah! '+lim+' completed ✨')}render();saveState()}function resetCurrent(){counts[id()]=0;render();saveState();showToast('Current dua reset')}function toggleTheme(){isDark=!isDark;applyTheme();saveState()}function applyTheme(){document.documentElement.setAttribute('data-theme',isDark?'dark':'light');themeBtn.innerHTML=isDark?'<i class="fas fa-sun"></i> Light Mode':'<i class="fas fa-moon"></i> Dark Mode'}function showToast(m){toast.textContent=m;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1700)}function ripple(e){const r=btn.getBoundingClientRect(),p=e&&e.touches&&e.touches[0]?e.touches[0]:e,x=((p&&p.clientX?p.clientX:r.left+r.width/2)-r.left),y=((p&&p.clientY?p.clientY:r.top+r.height/2)-r.top),s=document.createElement('span');s.style.cssText='position:absolute;left:'+x+'px;top:'+y+'px;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.65);transform:translate(-50%,-50%) scale(0);animation:rip .6s ease-out forwards;pointer-events:none';btn.appendChild(s);setTimeout(()=>s.remove(),650)}function celebrate(){const cx=innerWidth/2,cy=innerHeight*.45;for(let i=0;i<34;i++){const sp=document.createElement('i');sp.className='spark';const a=Math.random()*Math.PI*2,d=80+Math.random()*140;sp.style.left=cx+'px';sp.style.top=cy+'px';sp.style.width=sp.style.height=(5+Math.random()*7)+'px';sp.style.setProperty('--x',Math.cos(a)*d+'px');sp.style.setProperty('--y',Math.sin(a)*d+'px');document.body.appendChild(sp);setTimeout(()=>sp.remove(),900)}}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
btn.onclick=tap;$('reset-btn').onclick=resetCurrent;themeBtn.onclick=toggleTheme;search.onchange=()=>{currentIndex=Number(search.value)||0;render();saveState();window.scrollTo({top:0,behavior:'smooth'})};document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});document.querySelectorAll('a[href]').forEach(a=>a.addEventListener('click',function(e){const h=this.getAttribute('href');if(!h||h==='#'||h.startsWith('http'))return;e.preventDefault();document.body.classList.add('is-leaving');setTimeout(()=>location.href=h,260)}));async function refreshDuasFromServer(silent=true){const latest=await loadDuas();const before=JSON.stringify(duas.map(d=>d.id+':'+d.title+':'+d.limit));const after=JSON.stringify(latest.map(d=>d.id+':'+d.title+':'+d.limit));duas=latest;if(currentIndex>=duas.length)currentIndex=0;render();if(!silent&&before!==after)showToast('Dua list refreshed ✨')}document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshDuasFromServer(true)});window.addEventListener('focus',()=>refreshDuasFromServer(true));(async()=>{loadState();applyTheme();duas=await loadDuas();if(currentIndex>=duas.length)currentIndex=0;render()})();
</script></body></html>
